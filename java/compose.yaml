services:
  postgres:
    image: postgres:17.12
    environment:
      POSTGRES_DB: time_deposit
      POSTGRES_USER: time_deposit
      POSTGRES_PASSWORD: time_deposit_dev
    ports:
      - "127.0.0.1:${TIME_DEPOSIT_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
